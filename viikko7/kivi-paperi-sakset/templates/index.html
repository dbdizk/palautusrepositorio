<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivi Paperi Sakset</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .game-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .game-option {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .game-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .game-option:active {
            transform: translateY(0);
        }
        
        .description {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪨 📄 ✂️</h1>
        <h2 style="text-align: center; color: #666; margin-bottom: 30px;">Kivi Paperi Sakset</h2>
        
        <form method="POST" action="/start">
            <div class="game-options">
                <button type="submit" name="game_type" value="a" class="game-option">
                    👥 Pelaaja vs Pelaaja
                </button>
                <button type="submit" name="game_type" value="b" class="game-option">
                    🤖 Pelaaja vs Tekoäly
                </button>
                <button type="submit" name="game_type" value="c" class="game-option">
                    🧠 Pelaaja vs Parannettu Tekoäly
                </button>
            </div>
        </form>
        
        <p class="description">
            Valitse pelityyppi aloittaaksesi pelin!
        </p>
        
        <div style="text-align: center; margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
            <div style="font-size: 0.9em; color: #666; margin-bottom: 5px;">Yhteensä pelejä pelattu</div>
            <div style="font-size: 2em; font-weight: bold; color: #667eea;">{{ total_games }}</div>
        </div>
    </div>
</body>
</html>
